# CLI Specification
# uni-dev — Agent Automation System
# Milestone: M8-webhooks-cli
# Version: 0.1.0

spec:
  name: cli
  milestone: M8-webhooks-cli
  repo: uni-dev
  description: >
    Click-based CLI surface for uni-dev. Provides commands for
    project initialization, pipeline execution, webhook listening,
    and status dashboards.

framework: click
entry_point: uni-dev = uni_dev.main:cli

commands:
  init:
    usage: uni-dev init /path/to/project
    description: Initialize knowledge base for a backend project.
    delegates_to: uni-kb CLI (subprocess)
    args:
      - name: project
        type: click.Path(exists=True)
        required: true
    status: already implemented in M2

  run:
    usage: uni-dev run "Add user avatar upload endpoint"
    description: Run the DDD→SDD→TDD pipeline for a single issue.
    args:
      - name: issue
        type: str
        required: true
    options:
      - name: --model
        flags: ["-m"]
        type: str
        default: deepseek-v4-pro
        help: Model to use for the orchestrator
      - name: --api-key
        flags: ["-k"]
        type: str
        envvar: DEEPSEEK_API_KEY
        help: DeepSeek API key
      - name: --classify
        flags: ["-c"]
        type: str
        help: Issue classification (add_feature, update_api, remove_feature, refactor)
      - name: --no-monitor
        flags: []
        type: bool
        default: false
        help: Disable the monitor middleware
    behavior:
      - Creates orchestrator via create_orchestrator()
      - Invokes orchestrator with the issue text as initial message
      - Streams task events if monitor is enabled
      - Prints final result

  listen:
    usage: uni-dev listen --port 8080
    description: Start the webhook listener server.
    options:
      - name: --port
        flags: ["-p"]
        type: int
        default: 8080
        help: Port to bind to
      - name: --host
        flags: ["-h"]
        type: str
        default: "0.0.0.0"
        help: Host to bind to
      - name: --secret
        flags: ["-s"]
        type: str
        envvar: WEBHOOK_SECRET
        help: Webhook HMAC secret
    behavior:
      - Creates FastAPI app from webhooks.server.create_app()
      - Runs uvicorn with app

  status:
    usage: uni-dev status
    description: Show pipeline status dashboard (monitor data).
    options:
      - name: --db
        flags: ["-d"]
        type: str
        default: ".uni-dev/monitor.db"
        help: Path to monitor SQLite database
    behavior:
      - Queries MonitorStore for run summary
      - Prints formatted table of recent runs
      - Shows success/error counts and average durations
