[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uni-dev"
version = "0.1.0"
description = "Multi-agent backend development automation — DDD → SDD → TDD pipeline"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "uni-kb @ git+https://github.com/admin-init/uni-kb@main",
    "deepagents>=0.5.3",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "uvloop>=0.22.0",
    "pyyaml>=6.0",
    "textual>=8.0",
    "textual-web>=0.2,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
uni-dev = "uni_dev.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/uni_dev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
